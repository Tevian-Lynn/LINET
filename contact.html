
<!DOCTYPE html>

<head>

    <title>Contact Information</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #FCE7F3;
            color: #3D2635;
        }

        nav {
            background-color: #6D3455;
            padding: 18px;
            text-align: center;
            border-bottom: 3px solid #B8860B;
        }

        nav a {
            color: #FFFFFF;
            text-decoration: none;
            margin: 10px;
            display: inline-block;
        }

        nav a:hover {
            color: #F7D98B;
        }

        main {
            max-width: 800px;
            margin: auto;
            padding: 30px 20px;
        }

        h1 {
            text-align: center;
            color: #6D3455;
            margin-bottom: 10px;
        }

        .intro {
            text-align: center;
            margin-bottom: 30px;
        }

        .card {
            background-color: #FFFFFF;
            padding: 22px;
            margin: 20px auto;
            border-left: 4px solid #B8860B;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(61, 38, 53, 0.08);
        }

        .contact-item {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .contact-item img {
            width: 35px;
            height: 35px;
            object-fit: contain;
        }

        h2 {
            color: #6D3455;
            font-size: 20px;
            margin-top: 0;
        }

        p {
            line-height: 1.7;
            overflow-wrap: anywhere;
        }

        .contact-link {
            color: #6D3455;
            text-decoration: none;
            font-weight: bold;
        }

        .contact-link:hover {
            color: #B8860B;
            text-decoration: underline;
        }

        .whatsapp-button {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background-color: #25D366;
            color: #FFFFFF;
            padding: 12px 18px;
            border-radius: 25px;
            text-decoration: none;
            font-weight: bold;
        }

        .whatsapp-button:hover {
            background-color: #1DA851;
            color: #FFFFFF;
        }

        footer {
            background-color: #6D3455;
            color: #FFFFFF;
            text-align: center;
            padding: 18px;
            margin-top: 30px;
        }
    </style>
</head>
